# Compbird — production service definition for the Hostinger VPS that already
# runs the Ratifyly stack (engine + app + caddy + autoheal) via docker-compose.
# Compbird REUSES that stack's Python CMA engine over HTTP — it is the ONLY
# shared piece. Nothing here touches the Ratifyly app container.
#
# ── Two ways to run it ────────────────────────────────────────────────────────
#
# OPTION A — MERGE into the existing compose file (recommended: one stack, one
# network, real `depends_on`):
#   1. Clone this repo on the VPS next to the ratifyly checkout, e.g. /root/compbird.
#   2. Copy the `compbird:` service block below into the ratifyly
#      docker-compose.yml `services:` section, and add `compbird-data:` to its
#      top-level `volumes:`.
#   3. In the copied block: set `build.context` to the compbird checkout path
#      (e.g. /root/compbird), fix the env_file path likewise, and UNCOMMENT the
#      depends_on stanza. The engine-outputs / engine-data volume refs resolve
#      to the volumes already declared in that file — delete the `external:`
#      volume stanzas at the bottom of this file, they are Option-B-only.
#   4. Append deploy/Caddyfile.compbird to the stack's Caddyfile.
#   5. docker compose --env-file .env up -d --build compbird caddy
#
# OPTION B — keep this file standalone and join the existing stack's network:
#   docker compose -f deploy/docker-compose.compbird.yml up -d --build
#   Requires the ratifyly stack to be up first. The external names below assume
#   the ratifyly compose project is named "ratifyly" (folder name) — check with
#   `docker network ls` / `docker volume ls` and adjust the `name:` fields.
#   depends_on cannot cross compose files, so engine startup ordering is not
#   enforced — compbird degrades gracefully (engine calls fail as data) and the
#   healthcheck/autoheal recover it.

services:
  compbird:
    build:
      context: ..                      # repo root (this file lives in deploy/)
      dockerfile: Dockerfile
      args:
        # Build-time inlining: NEXT_PUBLIC_* are baked into client bundles and
        # the prerendered robots/sitemap. Sourced from .env.production via the
        # shell env when you run `docker compose --env-file .env.production ...`
        # from the repo root, or hardcode them here.
        NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-https://compbird.com}"
        NEXT_PUBLIC_COMPBIRD_CONTACT_EMAIL: "${NEXT_PUBLIC_COMPBIRD_CONTACT_EMAIL:-}"
    env_file:
      - ../.env.production             # runtime secrets/config (never committed)
    volumes:
      - compbird-data:/data            # SQLite DB + override-audit JSONL — persistent
      # Generated CMA PDFs: the engine writes them to its outputs volume; the
      # /api/compbird/pdf route streams them from CMA_OUTPUTS_DIR (read-only).
      - engine-outputs:/app/engine-outputs:ro
      # Prebuilt address search index (search_index.sqlite) on the engine-data
      # volume. Without this mount the typeahead has NO fallback in production
      # (the Python-spawn path is absent) — searches would return errors.
      - engine-data:/app/engine-data:ro
    expose:
      - "3000"                         # NOT published to the host — Caddy-only
    restart: unless-stopped
    # OPTION A ONLY (same file as the engine service) — uncomment:
    # depends_on:
    #   engine:
    #     condition: service_healthy
    healthcheck:
      # node:20-slim has no wget/curl; Node 20's global fetch does the job.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s                # Next.js warmup + prisma db push on boot
    labels:
      autoheal: "true"                 # the stack's autoheal sidecar restarts us if unhealthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1g                   # cap so an engine spike can't starve the box

volumes:
  compbird-data:
  # ── OPTION B ONLY: bind to the ratifyly stack's existing volumes/network. ──
  # (Option A: DELETE these two stanzas — the refs resolve within the merged file.)
  engine-outputs:
    external: true
    name: ratifyly_engine-outputs
  engine-data:
    external: true
    name: ratifyly_engine-data

networks:
  # OPTION B ONLY: join the existing stack's default network so `engine` and
  # `compbird` resolve by service name (Caddy must reach compbird:3000 too).
  # (Option A: DELETE this stanza.)
  default:
    external: true
    name: ratifyly_default
